#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: ${vm_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/${vm_user}
    shell: /bin/bash
    ssh-authorized-keys:
      - ${ssh_public_key}

${password_yaml}

package_update: false
package_upgrade: false

packages:
  - qemu-guest-agent
  - curl

runcmd:
  - systemctl enable --now qemu-guest-agent
  - echo "cloud-init done" > /var/log/cloud-init-done.txt
