#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/debian
    shell: /bin/bash
    ssh-authorized-keys:
      - ${ssh_public_key}

package_update: true
packages:
  - qemu-guest-agent
  - curl

runcmd:
  # Ensure the qemu-guest-agent service is running
  - systemctl enable --now qemu-guest-agent
